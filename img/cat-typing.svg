<svg xmlns="http://www.w3.org/2000/svg" viewBox="45 35 375 382" width="540" height="550" role="img" aria-label="Black cat with a loading spinner, blinking">
  <style>
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
    .spinner { transform-box: view-box; transform-origin: 143px 133px; animation: spin 0.9s steps(8) infinite; }
    @keyframes blink {
      0%, 44%, 50%, 86%, 92%, 98%, 100% { transform: scaleY(1); }
      47%, 89%, 95% { transform: scaleY(0.08); }
    }
    .paw { animation: tap .17s infinite alternate ease-in-out; }
    .paw.b { animation-delay: -.17s; }
    .glow { animation: glow 2.3s infinite alternate ease-in-out; }
    @keyframes tap { from { transform: translateY(-6px); } to { transform: translateY(1px); } }
    @keyframes glow { from { opacity: .75; } to { opacity: 1; } }
    .tear { animation: tear 1.8s infinite ease-in; }
    .tear.b { animation-delay: -.65s; }
    @keyframes tear {
      0% { transform: translateY(0) scale(.3); opacity: 0; }
      20% { transform: translateY(0) scale(1); opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateY(16px) scale(1); opacity: 0; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .eye, .spinner, .paw, .glow, .tear { animation: none; } }
  </style>
